name: Tugilgan kun APK

on:
  push:
    paths:
      - 'tugilgan-kun/**'
      - '.github/workflows/tugilgan-kun-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tugilgan-kun
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # --- Imzo kaliti bor boʻlsa: Play Market uchun imzolangan AAB va APK ---
      - name: Imzo kalitini tayyorlash
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Imzolangan AAB va APK yigʻish
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease assembleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab TugilganKun-PlayMarket.aab
          cp app/build/outputs/apk/release/app-release.apk TugilganKun.apk

      # --- Kalit hali qoʻshilmagan boʻlsa: sinov uchun debug APK ---
      - name: Sinov APK yigʻish
        if: env.HAS_KEY != 'true'
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk TugilganKun.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TugilganKun
          path: |
            tugilgan-kun/TugilganKun.apk
            tugilgan-kun/TugilganKun-PlayMarket.aab
          if-no-files-found: ignore

      - name: Release ga joylash
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tugilgan-kun-v${{ github.run_number }}
          name: Tugʻilgan kun taqvimi v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            tugilgan-kun/TugilganKun.apk
            tugilgan-kun/TugilganKun-PlayMarket.aab
          fail_on_unmatched_files: false
          body: |
            **TugilganKun.apk** — telefonga toʻgʻridan-toʻgʻri oʻrnatish uchun.
            **TugilganKun-PlayMarket.aab** — Play Console'ga yuklash uchun (faqat imzo kaliti qoʻshilganda chiqadi).
