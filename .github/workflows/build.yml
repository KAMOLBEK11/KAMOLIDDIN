name: Oila Nazorat APK

on:
  push:
    paths:
      - 'oila-nazorat/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oila-nazorat
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yig'ish
        run: gradle assembleDebug --stacktrace

      - name: APK ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: oila-nazorat-apk
          path: oila-nazorat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
