name: Oila Nazorat APK

on:
  push:
    paths:
      - 'oila-nazorat/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oila-nazorat
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK yig'ish (release, imzosiz)
        run: gradle assembleRelease --stacktrace

      - name: APK ni saqlash (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: oila-nazorat-apk
          path: oila-nazorat/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error

      - name: APK ni 'apk' tarmog'iga yuklash
        working-directory: ${{ github.workspace }}
        run: |
          BASE=oila-nazorat/app/build/outputs/apk
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          OCHIQ=$(ls $BASE/ochiq/release/*.apk 2>/dev/null | head -1)
          YASH=$(ls $BASE/yashirin/release/*.apk 2>/dev/null | head -1)
          cp "$OCHIQ" /tmp/ochiq.apk
          cp "$YASH" /tmp/yashirin.apk
          git checkout --orphan apk
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p out
          cp /tmp/ochiq.apk out/app-ochiq-unsigned.apk
          cp /tmp/yashirin.apk out/app-yashirin-unsigned.apk
          git add -f out/app-ochiq-unsigned.apk out/app-yashirin-unsigned.apk
          git commit -m "APK ${{ github.sha }}"
          git push -f origin apk
