plugins {
    id 'com.android.application'
}

// Imzo kaliti GitHub Secrets orqali beriladi (README ga qarang)
def ksFile = System.getenv('KEYSTORE_FILE')
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'uz.kamolbek.tugilgankun'
    compileSdk 36

    defaultConfig {
        applicationId 'uz.kamolbek.tugilgankun'
        minSdk 26
        targetSdk 36
        versionCode 100 + runNo
        versionName "2.${runNo}"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
